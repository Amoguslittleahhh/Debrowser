<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Peek</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="peek.css">
</head>
<body>
  <!--
    Behind a Peek (window.js, openPeek): the page dimmed, and above the card
    what it is and the two things to do with it. A click on the dimmed page
    puts it away. The card itself is another view, laid over this one.
  -->
  <header class="bar">
    <span class="what">
      <span class="spinner" id="spinner" hidden></span>
      <strong id="title">Loading…</strong>
      <span id="host"></span>
    </span>
    <button type="button" class="primary" id="promote">Open as tab</button>
    <button type="button" class="close" id="close" aria-label="Close (Esc)" title="Close (Esc)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </header>
  <script src="theme.js"></script>
  <script src="peek.js"></script>
</body>
</html>
