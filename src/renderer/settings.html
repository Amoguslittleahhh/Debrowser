<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <h1>Settings</h1>
    <button class="close" id="close" title="Close settings (Esc)" aria-label="Close settings">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>

  <main>
    <!--
      Every control is generated from the same descriptor list in settings.js,
      so a new preference is one entry there rather than a block of markup, a
      handler and a place to forget to read the saved value back.
    -->
    <section>
      <h2>Appearance</h2>
      <div class="rows" id="appearance"></div>
    </section>

    <section>
      <h2>Search and startup</h2>
      <div class="rows" id="browsing"></div>
    </section>

    <section>
      <h2>Memory</h2>
      <div class="rows" id="resources"></div>
      <p class="note">
        The governor moves tabs between resource tiers on its own. These set the
        limits it works within — it never exceeds them, and it reclaims earlier
        when the machine is under pressure regardless of what is set here.
      </p>
    </section>

  </main>

  <script src="theme.js"></script>
  <script src="settings.js"></script>
</body>
</html>
