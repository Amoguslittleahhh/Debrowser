<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: debrowser:;">
  <title>Downloads</title>
  <link rel="stylesheet" href="theme.css">
  <!--
    The menu's stylesheet first: the sheet, the backdrop, the shadow and the
    way it arrives are one treatment, and the two panels in this browser's
    toolbar should not look like they came from different applications.
  -->
  <link rel="stylesheet" href="menu.css">
  <link rel="stylesheet" href="flyout.css">
</head>
<body class="menu-body">
  <!--
    The backdrop fills the window and is invisible. It catches the click that
    dismisses the panel - the job a system popup does with a pointer grab this
    cannot take - so it is an element rather than nothing.
  -->
  <div class="backdrop" id="backdrop"></div>

  <div class="sheet flyout" id="sheet" role="dialog" tabindex="-1" aria-label="Downloads">
    <header class="flyout-head">
      <h2>Downloads</h2>
      <button class="flyout-all" id="see-all" type="button">See all</button>
    </header>
    <div class="flyout-list" id="list"></div>
    <p class="flyout-empty" id="empty" hidden>Files you download appear here.</p>
  </div>

  <script src="theme.js"></script>
  <script src="flyout.js"></script>
</body>
</html>
