<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- `img-src` covers the site logos on the tiles, and covers only the two
       sources they can come from: a `data:` icon the browser already holds, and
       `debrowser://icon`, which is fetched by the browser process without
       cookies. This page never reaches a site itself. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: debrowser:;">
  <title>New tab</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!--
    Still close to empty, and the line it holds is worth stating.

    A new tab page is looked at for a fraction of a second before something is
    typed into it, and this browser's whole claim is about what a tab costs - so
    the most-opened page in the browser must not be the most expensive. What it
    has now is eight tiles for the sites you actually go to, because a start
    page with nothing on it is not restraint, it is a page that makes you type
    an address you visit every day.

    What is still refused: feeds, images, suggestions, and any request this page
    makes itself. The tiles come from the browser's own history, and a site's
    logo is fetched by the *browser process* through `debrowser://icon`, without
    cookies - an `<img>` pointed at the site would tell eight companies every
    time a tab is opened.
  -->
  <main>
    <h1 id="wordmark">Debrowser</h1>

    <form id="search" autocomplete="off">
      <input id="q" type="text" data-transient spellcheck="false" autocomplete="off"
             aria-label="Search or type a URL" placeholder="Search or type a URL">
    </form>

    <nav class="tiles" id="tiles" aria-label="Frequently visited"></nav>

    <p class="stat" id="stat"></p>
  </main>

  <script src="theme.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
