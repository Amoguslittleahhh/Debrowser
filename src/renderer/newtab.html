<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>New tab</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!--
    Deliberately close to empty. A new tab page is looked at for a fraction of a
    second before something is typed into it, and this browser's entire claim is
    about what a tab costs - so a start page full of tiles, feeds and images
    would be the most-opened page in the browser and the most expensive.

    No network requests of any kind: no fonts, no favicons, no suggestions. The
    page is inert until a key is pressed.
  -->
  <main>
    <h1 id="wordmark">Debrowser</h1>

    <form id="search" autocomplete="off">
      <input id="q" type="text" data-transient spellcheck="false" autocomplete="off"
             aria-label="Search or type a URL" placeholder="Search or type a URL">
    </form>

    <p class="stat" id="stat"></p>
  </main>

  <script src="theme.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
