<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- `img-src` covers the site logos on the tiles, and covers only the two
       sources they can come from: a `data:` icon the browser already holds, and
       `debrowser://icon`, which is fetched by the browser process without
       cookies. This page never reaches a site itself. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: debrowser:;">
  <title>New tab</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!--
    Still close to empty, and the line it holds is worth stating.

    A new tab page is looked at for a fraction of a second before something is
    typed into it, and this browser's whole claim is about what a tab costs - so
    the most-opened page in the browser must not be the most expensive. What it
    has now is eight tiles for the sites you actually go to, because a start
    page with nothing on it is not restraint, it is a page that makes you type
    an address you visit every day.

    What is still refused: feeds, images, suggestions, and any request this page
    makes itself. The tiles come from the browser's own history, and a site's
    logo is fetched by the *browser process* through `debrowser://icon`, without
    cookies - an `<img>` pointed at the site would tell eight companies every
    time a tab is opened.
  -->
  <main>
    <h1 id="wordmark">Debrowser</h1>
    <!-- The mark: one tab awake in a frame, the rest asleep. The dot is the
         user's accent; the frame is the text colour. Shown by every design
         but Legacy, which keeps its wordmark above. -->
    <div class="brand" aria-hidden="true">
      <svg class="brand-mark" viewBox="0 0 64 64" width="26" height="26">
        <rect x="10" y="10" width="44" height="44" rx="13" fill="none" stroke="currentColor" stroke-width="5.5"/>
        <circle class="brand-dot" cx="26" cy="26" r="7"/>
      </svg>
      <span class="brand-name">debrowser</span>
    </div>

    <form id="search" autocomplete="off">
      <input id="q" type="text" data-transient spellcheck="false" autocomplete="off"
             aria-label="Search or type a URL" placeholder="Search or type a URL">
      <!-- Ledger's go button, in the accent. The other designs name the key
           instead (see newtab.css); Enter works the same in all of them. -->
      <button class="go" type="submit" aria-label="Go">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 8h12M9 3l5 5-5 5"/></svg>
      </button>
    </form>

    <nav class="tiles" id="tiles" aria-label="Frequently visited"></nav>

    <p class="stat" id="stat"></p>
  </main>

  <!-- Recent pages, a scroll below the search: filled from the browser's own
       history, so a private window, which keeps none, never shows it. -->
  <section class="continue" id="continue" hidden aria-labelledby="continue-title">
    <div class="continue-head">
      <h2 id="continue-title">Continue with these tabs</h2>
      <div class="continue-menu">
        <button type="button" class="continue-more" id="continue-more" aria-label="Card options"
                aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><circle cx="8" cy="3" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="13" r="1.3"/></svg>
        </button>
        <div class="continue-pop" id="continue-pop" hidden>
          <button type="button" id="continue-hide">Hide this card</button>
        </div>
      </div>
    </div>
    <div class="continue-list" id="continue-list"></div>
    <button type="button" class="continue-all" id="continue-all">See more</button>
  </section>

  <script src="theme.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
