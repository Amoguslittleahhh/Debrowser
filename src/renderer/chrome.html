<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: debrowser:;">
  <title>Debrowser</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <!--
    The tab strip is the title bar. `-webkit-app-region: drag` on the strip and
    no-drag on everything interactive inside it, so empty space moves the window
    the way the old title bar did, and the system's own minimise/maximise/close
    sit over the reserved gutter on the right.
  -->
  <div class="tabstrip" id="tabstrip">
    <div class="tabs" id="tabs"></div>
    <!-- The label is drawn only with the strip down the side, where the button
         is a full-width row and a lone + in the middle of a 240px column reads
         as an orphaned glyph. Across the top it is a 28px square beside the
         tabs, where a word would not fit and is not needed. -->
    <button class="new-tab" id="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      <span class="new-tab-label">New tab</span>
    </button>
    <div class="strip-filler"></div>

    <!--
      The pin, at the foot of the strip. Only drawn with the strip down the
      side, where there is a foot to put it at and something for it to do:
      across the top nothing slides, so nothing needs holding open.
    -->
    <button class="pin" id="pin" type="button" aria-pressed="false"
            title="Keep the tab strip open" aria-label="Keep the tab strip open">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M6.5 2.5h3l-.4 4 2.4 2v1H4.5v-1l2.4-2z"/>
        <path d="M8 9.5V13"/>
      </svg>
    </button>
  </div>

  <div class="toolbar">
    <div class="nav">
      <button class="icon-btn" id="back" title="Back (Alt+Left)" aria-label="Back">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
      </button>
      <button class="icon-btn" id="forward" title="Forward (Alt+Right)" aria-label="Forward">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
      </button>
      <button class="icon-btn" id="reload" title="Reload (Ctrl+R)" aria-label="Reload">
        <svg viewBox="0 0 16 16" aria-hidden="true" id="reload-icon">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2v3.2h-3.2"/>
        </svg>
      </button>
    </div>

    <div class="omnibox" id="omnibox">
      <!--
        The security indicator. A drawn glyph, not the 🔒 emoji it replaced:
        an emoji is rendered by whichever colour font the machine has, at
        whatever size that font decides, and the one part of a browser that
        should never look like it came from a chat message is the thing that
        says the connection is private.
      -->
      <svg class="scheme" id="scheme" viewBox="0 0 16 16" aria-hidden="true">
        <path id="scheme-a"/><path id="scheme-b"/><path id="scheme-c"/>
      </svg>
      <input id="url" type="text" spellcheck="false" autocomplete="off"
             placeholder="Search or type a URL" aria-label="Address and search bar">
    </div>

    <button class="icon-btn star" id="star" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page">
      <svg viewBox="0 0 16 16" aria-hidden="true" id="star-icon">
        <path d="M8 2.2l1.76 3.57 3.94.57-2.85 2.78.67 3.92L8 11.2l-3.52 1.85.67-3.92L2.3 6.34l3.94-.57z"/>
      </svg>
    </button>

    <!--
      Downloads. Hidden until there is something to show, the way Chrome and
      Edge both do it: a button that is dead for the first hour of every session
      is a button in the way. The ring around it fills while something is
      arriving, so the toolbar answers "is it done yet" without being opened.
    -->
    <button class="icon-btn downloads" id="downloads" hidden
            title="Downloads (Ctrl+J)" aria-label="Downloads">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 2.5v7"/><path d="M5 7l3 3 3-3"/>
        <path d="M3 11.5v1.5a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5v-1.5"/>
      </svg>
      <span class="downloads-ring" id="downloads-ring" aria-hidden="true"></span>
    </button>

    <!--
      Private windows only: which kind of window this is, and whether its
      connection is up. Words, not just a colour, because "is this the private
      window?" is a question people get wrong when the only answer is a tint.
    -->
    <button class="private-pill" id="private" hidden title="Private connection" aria-label="Private connection">
      <span class="private-dot" aria-hidden="true"></span>
      <span class="private-text" id="private-text">Private</span>
    </button>

    <button class="meter" id="meter" title="Resource governor — click for the task manager">
      <span class="meter-bar"><span class="meter-fill" id="meter-fill"></span></span>
      <span class="meter-text" id="meter-text">—</span>
    </button>

    <button class="icon-btn" id="menu" title="Customise and control Debrowser" aria-label="Menu">
      <svg viewBox="0 0 16 16" aria-hidden="true" class="dots">
        <circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/>
      </svg>
    </button>

    <!--
      Loading line. Chromium reports that a page is loading, not how far along
      it is, so this creeps towards nearly-done and completes when the load
      does - which is what every browser does, because a bar that sits still is
      worse than no bar. It is a scaleX on one element: no layout, no repaint
      of anything around it.
    -->
    <div class="progress" id="progress" aria-hidden="true"></div>
  </div>

  <!--
    Saved sites, under the toolbar.

    A row of real buttons rather than links: this is the browser's own UI, and
    navigating is a command sent to the browser process, not a document the
    chrome is allowed to load. Empty until the first list arrives, and hidden
    entirely when the strip runs down the side - there the chrome already owns a
    full-height column and the bookmarks go in it.
  -->
  <nav class="bookmarks" id="bookmarks" aria-label="Bookmarks"></nav>

  <!--
    Find in page.

    A strip of chrome rather than a card floating over the page's top right
    corner, which is where Chrome puts it and where, on a page of search
    results, it covers the first result. The window gives it its 38px the same
    way it gives the bookmarks bar its 34, so nothing is painted over.
  -->
  <div class="findbar" id="findbar" hidden>
    <svg class="find-icon" viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L13.5 13.5"/>
    </svg>
    <input id="find-input" type="text" spellcheck="false" autocomplete="off"
           placeholder="Find in page" aria-label="Find in page">
    <span class="find-count" id="find-count" aria-live="polite"></span>
    <button class="icon-btn find-step" id="find-prev" title="Previous match (Shift+F3)"
            aria-label="Previous match">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg>
    </button>
    <button class="icon-btn find-step" id="find-next" title="Next match (F3)"
            aria-label="Next match">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <button class="icon-btn" id="find-close" title="Close find bar (Esc)" aria-label="Close find bar">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>

  <script src="theme.js"></script>
  <script src="chrome.js"></script>
</body>
</html>
