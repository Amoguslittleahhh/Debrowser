<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dark websites: a light page in oklch</title>
  <style>
    /* Tailwind 4's gray-50 and gray-900: near white, near black. */
    html { background: oklch(98.5% 0.002 247.839); color: oklch(21% 0.034 264.665); }
    body { margin: 0; padding: 24px; font: 16px/1.5 sans-serif; }
  </style>
</head>
<body>
  <p>A light page whose colours are written in a newer notation.</p>
</body>
</html>
