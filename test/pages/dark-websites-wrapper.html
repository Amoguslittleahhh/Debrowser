<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dark websites: dark on a wrapper</title>
  <style>
    /* As a single-page app is often built: nothing on the root or the body,
       the whole look on the element the app renders into. */
    html, body { margin: 0; }
    #app { min-height: 100vh; padding: 24px; box-sizing: border-box; background: #101318; color: #e6e8ee; font: 16px/1.5 sans-serif; }
  </style>
</head>
<body>
  <div id="app"><h1>Dark app</h1><p>Its colours are on the element it renders into.</p></div>
</body>
</html>
