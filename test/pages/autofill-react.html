<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout: controlled form</title>
  <!--
    A form run the way React runs one. The page's state is the truth, and it
    learns a value only from an input event (change, for a list) whose value
    differs from the last one the page itself wrote - React's value tracker.
    After every event the whole form is drawn again from that state, so a value
    put in without an event the page believes is wiped at the next redraw.
  -->
  <style>
    body { margin: 0; padding: 24px; font: 15px system-ui; background: #fff; color: #111; }
    input, select { display: block; margin: 2px 0 8px; padding: 4px; width: 300px; font: inherit; }
  </style>
</head>
<body>
  <form id="react" onsubmit="return false">
    <label for="name">Full name</label><input id="name" name="name" autocomplete="name">
    <label for="street">Street</label><input id="street" name="street" autocomplete="street-address">
    <label for="city">City</label><input id="city" name="city" autocomplete="address-level2">
    <label for="postal">Postcode</label><input id="postal" name="postal" autocomplete="postal-code">
    <label for="country">Country</label>
    <select id="country" name="country" autocomplete="country">
      <option value="">-</option><option value="GB">United Kingdom</option><option value="US">United States</option>
    </select>
    <label for="email">Email</label><input id="email" name="email" autocomplete="email">
    <label for="number">Card number</label><input id="number" name="number" autocomplete="cc-number">
    <label for="exp">Expiry</label><input id="exp" name="exp" autocomplete="cc-exp">
  </form>
  <script>
    window.state = {};
    window.redraws = 0;
    const fields = [...document.querySelectorAll('#react input, #react select')];
    const native = {
      INPUT: Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value'),
      SELECT: Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value')
    };
    const tracked = new WeakMap();
    for (const el of fields) {
      const d = native[el.tagName];
      Object.defineProperty(el, 'value', {
        configurable: true,
        get() { return d.get.call(this); },
        set(v) { tracked.set(this, String(v)); d.set.call(this, v); }
      });
      tracked.set(el, el.value);
      window.state[el.name] = '';
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', (e) => {
        const now = d.get.call(e.target);
        if (tracked.get(e.target) === now) return;
        tracked.set(e.target, now);
        window.state[e.target.name] = now;
        redraw();
      });
    }
    function redraw() {
      window.redraws += 1;
      for (const el of fields) el.value = window.state[el.name];
    }
  </script>
</body>
</html>
