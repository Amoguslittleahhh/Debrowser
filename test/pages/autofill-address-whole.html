<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout: address whole</title>
  <!--
    The other common shape: one box for the whole name, one textarea for the
    whole street, and the country typed rather than picked.
  -->
  <style>
    body { margin: 0; padding: 24px; font: 15px system-ui; background: #fff; color: #111; }
    input, select, textarea { display: block; margin: 2px 0 8px; padding: 4px; width: 300px; font: inherit; }
  </style>
</head>
<body>
  <form id="ship" onsubmit="return false">
    <label for="full">Full name</label>
    <input id="full" name="full" autocomplete="name">
    <label for="street">Address</label>
    <textarea id="street" name="street" rows="3" autocomplete="street-address"></textarea>
    <label for="city">City</label>
    <input id="city" name="city" autocomplete="address-level2">
    <label for="region">Region</label>
    <input id="region" name="region" autocomplete="address-level1">
    <label for="postal">Postcode</label>
    <input id="postal" name="postal" autocomplete="postal-code">
    <label for="country">Country</label>
    <input id="country" name="country" autocomplete="country-name">
    <label for="email">Email</label>
    <input id="email" name="email" autocomplete="email">
    <label for="tel">Phone</label>
    <input id="tel" name="tel" autocomplete="tel">
  </form>
</body>
</html>
