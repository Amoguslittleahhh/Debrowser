<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Dark from the browser's own colours: no background or text colour set. -->
  <meta name="color-scheme" content="dark">
  <title>Dark websites: dark by color-scheme</title>
  <style>
    body { margin: 0; padding: 24px; font: 16px/1.5 sans-serif; }
    #glyph { display: inline-block; font-size: 96px; line-height: 1; }
  </style>
</head>
<body>
  <div id="glyph">&#x2588;&#x2588;</div>
  <p>Declares itself dark and leaves the colours to the browser.</p>
</body>
</html>
