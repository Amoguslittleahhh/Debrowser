<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout: address in parts</title>
  <!--
    A shipping form with autocomplete tokens, the name in two boxes and the
    street in two lines, the country a list whose values are codes.
  -->
  <style>
    body { margin: 0; padding: 24px; font: 15px system-ui; background: #fff; color: #111; }
    input, select, textarea { display: block; margin: 2px 0 8px; padding: 4px; width: 300px; font: inherit; }
    form { columns: 2; }
  </style>
</head>
<body>
  <form id="ship" onsubmit="return false">
    <label for="first">First name</label>
    <input id="first" name="first" autocomplete="shipping given-name">
    <label for="last">Last name</label>
    <input id="last" name="last" autocomplete="shipping family-name">
    <label for="org">Company</label>
    <input id="org" name="org" autocomplete="organization">
    <label for="line1">Address line 1</label>
    <input id="line1" name="line1" autocomplete="address-line1">
    <label for="line2">Address line 2</label>
    <input id="line2" name="line2" autocomplete="address-line2">
    <label for="city">City</label>
    <input id="city" name="city" autocomplete="address-level2">
    <label for="region">State</label>
    <input id="region" name="region" autocomplete="address-level1">
    <label for="postal">Postal code</label>
    <input id="postal" name="postal" autocomplete="postal-code">
    <label for="country">Country</label>
    <select id="country" name="country" autocomplete="country">
      <option value="">Choose</option>
      <option value="CA">Canada</option>
      <option value="GB">United Kingdom</option>
      <option value="US">United States</option>
    </select>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <label for="tel">Phone</label>
    <input id="tel" name="tel" type="tel" autocomplete="tel">
    <label for="notes">Delivery notes</label>
    <textarea id="notes" name="notes" rows="2"></textarea>
  </form>
</body>
</html>
