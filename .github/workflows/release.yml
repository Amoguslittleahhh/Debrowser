# Build installers for all three platforms on native runners.
#
# Native runners are not a convenience here. macOS artifacts *cannot* be built
# anywhere else - `dmg` needs `hdiutil`, which only exists on macOS - and
# building Windows from Linux needs Wine plus a 32-bit loader for the NSIS
# installer stub. Running each on its own runner removes both problems and is
# also the only way the macOS build can ever be signed and notarized.
#
# Triggered by pushing a tag (v1.0.0, v1.1.0, …), or by hand from the Actions
# tab. Artifacts are attached to a draft release, so nothing is published until
# a human looks at it.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the draft release

jobs:
  build:
    strategy:
      fail-fast: false   # a macOS failure must not hide a working Windows build
      matrix:
        include:
          - os: windows-latest
            platform: --win
            artifacts: dist/*.exe
          - os: macos-latest
            platform: --mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            platform: --linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/*.tar.gz

    runs-on: ${{ matrix.os }}

    # The `secrets` context is not available to a step-level `if`, but `env` is,
    # so the "do we have Azure credentials" question is answered once here and
    # read as a plain string below. Writing `if: secrets.X != ''` directly looks
    # right and silently never matches.
    env:
      AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm ci` can report success while Electron's postinstall fails to place
      # its binary, leaving node_modules/electron without the thing every later
      # step needs. The smoke step then dies with "Electron failed to install
      # correctly", three seconds in, which looks like a test failure and is
      # not. Seen on the Linux runner while the same commit installed fine on
      # Windows and macOS, so it is worth a cheap check rather than a re-run.
      - name: Ensure the Electron binary is present
        shell: bash
        run: node -e "require('electron')" > /dev/null || npm rebuild electron

      # The trim helper is Linux-only and is the one artifact that needs a
      # compiler. On the other two runners it is neither built nor shipped.
      - name: Build the trim helper
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:memtrim

      # Runs the real 41-check suite against real renderers before anything is
      # packaged, on the platform being packaged. This is the step that would
      # have caught every packaging bug found while writing this config.
      - name: Smoke test (headless)
        if: matrix.os == 'ubuntu-latest'
        run: npm run smoke:headless
      - name: Smoke test
        if: matrix.os != 'ubuntu-latest'
        run: npm run smoke

      # Signing is driven entirely by secrets, and their absence is a supported
      # state rather than an error: electron-builder treats an empty CSC_LINK as
      # "no certificate" and produces the same unsigned build as before. So this
      # one step covers both, and a fork with no secrets still builds.
      #
      # Set WINDOWS_CERT_BASE64 (base64 of a .pfx) and WINDOWS_CERT_PASSWORD to
      # sign with a file-based certificate. For Azure Trusted Signing - which is
      # what an individual developer can actually get since the 2023 rule that
      # code-signing keys live on certified hardware - set the AZURE_* secrets
      # instead and the step below takes over. docs/PACKAGING.md has both.
      - name: Package
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # macOS: without this, electron-builder hunts the runner's keychain for
          # any signing identity and fails confusingly when it finds none.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        if: ${{ !(matrix.os == 'windows-latest' && env.AZURE_SIGNING == 'true') }}
        run: npx electron-builder ${{ matrix.platform }} --publish never

      # Azure Trusted Signing. Windows only, and only when its secrets exist.
      # The endpoint/account/profile are not secret, but they are deployment
      # detail rather than source, so they are variables rather than literals.
      - name: Package (Azure Trusted Signing)
        if: ${{ matrix.os == 'windows-latest' && env.AZURE_SIGNING == 'true' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >
          npx electron-builder --win --publish never
          -c.win.azureSignOptions.endpoint=${{ vars.AZURE_SIGN_ENDPOINT }}
          -c.win.azureSignOptions.codeSigningAccountName=${{ vars.AZURE_SIGN_ACCOUNT }}
          -c.win.azureSignOptions.certificateProfileName=${{ vars.AZURE_SIGN_PROFILE }}

      # Says plainly whether what is about to be uploaded is signed. A release
      # that is silently unsigned because a secret expired is the failure this
      # catches, and it costs one command.
      - name: Report signature status
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0}: {1} {2}" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true       # a human decides when it goes out
          files: artifacts/*
          generate_release_notes: true
