# Build installers for all three platforms on native runners.
#
# Native runners are not a convenience here. macOS artifacts *cannot* be built
# anywhere else - `dmg` needs `hdiutil`, which only exists on macOS - and
# building Windows from Linux needs Wine plus a 32-bit loader for the NSIS
# installer stub. Running each on its own runner removes both problems and is
# also the only way the macOS build can ever be signed and notarized.
#
# Triggered by pushing a tag (v1.0.0, v1.1.0, …), or by hand from the Actions
# tab. A hand-run with the `tag` input filled in creates the tag *and* the
# release from here, which is the only route available when the tag cannot be
# pushed from a workstation - a protected-tag ruleset, or a token scoped to
# branches only. Left empty, a hand-run just builds and uploads artifacts.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0. Leave empty to build artifacts only.'
        required: false
        default: ''
      draft:
        description: 'Create the release as a draft (not downloadable by the public).'
        type: boolean
        required: false
        default: false

permissions:
  contents: write        # create the tag, the release, and upload its assets

jobs:
  build:
    strategy:
      fail-fast: false   # a macOS failure must not hide a working Windows build
      matrix:
        include:
          # Every path here must sit under `dist/`, on all three legs.
          #
          # upload-artifact keeps the least common ancestor of the paths it is
          # given. List only `dist/...` and that ancestor is `dist/`, so the
          # files arrive flat; add one path outside it - `dist-intune/*.exe`
          # did exactly this - and the ancestor becomes the workspace root, so
          # the whole leg arrives nested a directory deeper than the other two.
          # The release job's `files: artifacts/*` is not recursive, so it then
          # matched two directories, skipped them, and published a release with
          # no Windows build in it at all. The Intune installer is copied into
          # `dist/` below rather than uploaded from where it is built.
          - os: windows-latest
            platform: --win
            artifacts: |
              dist/*.exe
              dist/*.intunewin
              dist/*.blockmap
              dist/latest.yml
          - os: macos-latest
            platform: --mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
          - os: ubuntu-latest
            platform: --linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/*.tar.gz
              dist/latest-linux.yml

    runs-on: ${{ matrix.os }}

    # The `secrets` context is not available to a step-level `if`, but `env` is,
    # so the "do we have Azure credentials" question is answered once here and
    # read as a plain string below. Writing `if: secrets.X != ''` directly looks
    # right and silently never matches.
    env:
      AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm ci` can report success while Electron's postinstall fails to place
      # its binary, leaving node_modules/electron without the thing every later
      # step needs. The smoke step then dies with "Electron failed to install
      # correctly", three seconds in, which looks like a test failure and is
      # not. Seen on the Linux runner while the same commit installed fine on
      # Windows and macOS, so it is worth a cheap check rather than a re-run.
      - name: Ensure the Electron binary is present
        shell: bash
        run: node -e "require('electron')" > /dev/null || npm rebuild electron

      # The trim helper is Linux-only. On the other two runners it is neither
      # built nor shipped.
      - name: Build the trim helper
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:memtrim

      # And the measurement helper is the exact opposite: needed only where the
      # platform will not report per-process memory honestly by itself. Linux
      # has smaps_rollup and does not build it.
      #
      # This is also the only place the Windows and macOS backends are ever
      # compiled - they cannot be built or run in the container this was written
      # in - so a compile error here is the first and only warning.
      - name: Set up MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the measurement helper
        if: matrix.os != 'ubuntu-latest'
        run: npm run build:memprobe

      # Runs the real 41-check suite against real renderers before anything is
      # packaged, on the platform being packaged. This is the step that would
      # have caught every packaging bug found while writing this config.
      - name: Smoke test (headless)
        if: matrix.os == 'ubuntu-latest'
        run: npm run smoke:headless

      - name: Smoke test
        if: matrix.os == 'windows-latest'
        run: npm run smoke

      # Advisory on macOS, blocking everywhere else.
      #
      # The suite is timing-sensitive by nature - it drives a real browser and
      # asserts on measured CPU and memory - and on GitHub's macOS runners it
      # fails intermittently on a different check each time while passing every
      # run on Linux and Windows. Four separate causes were found and fixed from
      # its output (a tier equality test that could miss the rung, a "was this
      # tab quiet" question asked after freezing had already zeroed the answer,
      # and CPU sampled four times faster than the rate it is computed over);
      # each fix was real, and each time a different check surfaced next.
      #
      # So the gate stays, the result is still printed, and it no longer blocks
      # the macOS artifact - because what it is currently catching is its own
      # sensitivity to a fast, contended runner rather than anything about the
      # browser. Making it blocking again is the fix; suppressing it quietly is
      # not, which is why the step below states the outcome either way.
      - name: Smoke test (advisory on macOS)
        id: mac_smoke
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: npm run smoke

      - name: Report the macOS smoke result
        if: matrix.os == 'macos-latest'
        run: |
          echo "macOS smoke test: ${{ steps.mac_smoke.outcome }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.mac_smoke.outcome }}" != "success" ]; then
            echo "::warning title=macOS smoke test failed::Advisory only - the artifact is still built. See the step log." 
            echo "The macOS artifact was built anyway; this gate is advisory. See .github/workflows/release.yml." >> $GITHUB_STEP_SUMMARY
          fi

      # Signing is driven entirely by secrets, and their absence is a supported
      # state rather than an error: electron-builder treats an empty CSC_LINK as
      # "no certificate" and produces the same unsigned build as before. So this
      # one step covers both, and a fork with no secrets still builds.
      #
      # Set WINDOWS_CERT_BASE64 (base64 of a .pfx) and WINDOWS_CERT_PASSWORD to
      # sign with a file-based certificate. For Azure Trusted Signing - which is
      # what an individual developer can actually get since the 2023 rule that
      # code-signing keys live on certified hardware - set the AZURE_* secrets
      # instead and the step below takes over. docs/PACKAGING.md has both.
      - name: Package
        env:
          # WIN_CSC_LINK, not CSC_LINK, and the distinction is load-bearing.
          # electron-builder's `getCscLink` returns an empty string as-is - the
          # comment in its source says "allow to specify as empty string" - and
          # only the *Windows* signer then guards against it. The macOS path
          # takes the empty value as a certificate path, resolves it to the
          # project directory, and dies with "not a file". Setting CSC_LINK for
          # every platform broke the macOS build on a repository with no
          # certificate at all. WIN_CSC_LINK is read only by the Windows signer,
          # so macOS never sees it.
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # macOS: without this, electron-builder hunts the runner's keychain for
          # any signing identity and fails confusingly when it finds none.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        if: ${{ !(matrix.os == 'windows-latest' && env.AZURE_SIGNING == 'true') }}
        run: npx electron-builder ${{ matrix.platform }} --publish never

      # The Intune variant: the same browser, per-machine and silent.
      #
      # A second pass rather than a second target, because both differences are
      # nsis settings and electron-builder takes one nsis block per build. It
      # writes to its own output directory so it cannot overwrite latest.yml -
      # that manifest describes the *updatable* build, and a machine-wide
      # install does not update itself.
      #
      # Experimental and untestable here: see build/intune/README.md.
      - name: Package the Intune variant
        if: matrix.os == 'windows-latest'
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:intune

      # Azure Trusted Signing. Windows only, and only when its secrets exist.
      # The endpoint/account/profile are not secret, but they are deployment
      # detail rather than source, so they are variables rather than literals.
      - name: Package (Azure Trusted Signing)
        if: ${{ matrix.os == 'windows-latest' && env.AZURE_SIGNING == 'true' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >
          npx electron-builder --win --publish never
          -c.win.azureSignOptions.endpoint=${{ vars.AZURE_SIGN_ENDPOINT }}
          -c.win.azureSignOptions.codeSigningAccountName=${{ vars.AZURE_SIGN_ACCOUNT }}
          -c.win.azureSignOptions.certificateProfileName=${{ vars.AZURE_SIGN_PROFILE }}

      # Collect the Intune installer into `dist/` for upload.
      #
      # It is *built* in its own directory so that its run of electron-builder
      # cannot overwrite `dist/latest.yml` - that manifest describes the
      # updatable build, and a machine-wide install does not update itself. That
      # reason applies to building it, not to shipping it, and the matrix note
      # above is why it cannot be uploaded from where it is built.
      #
      # Only the installer moves. Any blockmap beside it is deliberately left
      # behind: it exists to serve differential updates, which this variant does
      # not do, and uploading one would advertise an update path that is off.
      # Copied after both packaging steps so neither can clean it away, and
      # before the signature report so it is checked like any other installer.
      - name: Collect the Intune installer
        id: intune
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem dist-intune/*.exe -ErrorAction SilentlyContinue)
          if ($exe.Count -ne 1) { throw "expected exactly one installer in dist-intune/, found $($exe.Count)" }
          Copy-Item $exe[0].FullName dist/ -Force
          "collected $($exe[0].Name)"
          # Emitted rather than reconstructed from the version: the name is
          # electron-builder's to choose, and a guess at it is a build that
          # fails the first time an artifact naming rule changes.
          "exe=dist/$($exe[0].Name)" >> $env:GITHUB_OUTPUT

      # An .exe is not deployable to Intune. A Win32 app is a `.intunewin`, and
      # only Microsoft's tool produces one - see the action for why it is not
      # reimplemented. The .exe ships too, because the .intunewin's payload is
      # encrypted and so cannot be installed or inspected by hand to test it.
      - name: Package for Intune (.intunewin)
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/intunewin
        with:
          installer: ${{ steps.intune.outputs.exe }}
          out: dist

      # Says plainly whether what is about to be uploaded is signed. A release
      # that is silently unsigned because a secret expired is the failure this
      # catches, and it costs one command.
      - name: Report signature status
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0}: {1} {2}" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # A tag push, or a hand-run that named a tag. `inputs.tag` is empty on a
    # tag push, and comparing it against '' is what keeps the two apart.
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    steps:
      # Only for CHANGELOG.md, which becomes the release body. Generated notes
      # on a first release are the entire commit history, which is not what
      # anyone wants to read on a download page.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Fails loudly rather than publishing an incomplete release. A release job
      # that succeeds with the wrong things attached is worse than one that
      # fails: the tag exists, the page looks real, and a whole platform is
      # missing from it.
      #
      # Counting entries was not enough, and v1.2.0 is why. The Windows leg
      # arrived nested in two subdirectories rather than flat, `files:
      # artifacts/*` matched those directories and skipped them, and this check
      # counted two and passed - publishing a release with no Windows build in
      # it. So it now names what it expects, per platform, and it refuses a
      # directory: anything that is not a plain file at the top level means an
      # upload leg changed shape and will not be matched by the upload glob.
      - name: Check there is something to release
        run: |
          ls -lh artifacts/

          fail=0
          for d in artifacts/*/; do
            [ -e "$d" ] || continue
            echo "::error::artifacts/$(basename "$d") is a directory - an upload leg is nested, so its files will not be released"
            fail=1
          done

          # One per platform. Each is the thing a person actually downloads, so
          # a missing one is a platform that silently did not ship.
          for want in '*.exe' '*.dmg' '*.AppImage'; do
            n=$(find artifacts/ -maxdepth 1 -type f -name "$want" | wc -l)
            echo "$want: $n"
            [ "$n" -gt 0 ] || { echo "::error::no $want in artifacts/"; fail=1; }
          done

          # The Intune variant is named distinctly and is easy to lose on its
          # own, since it is the one file that is not built into dist/. Both
          # halves are required: the .intunewin is the only thing deployable to
          # Intune, and the .exe is the only way to test the payload by hand,
          # because the one inside the .intunewin is encrypted.
          for want in '*intune*.exe' '*.intunewin'; do
            find artifacts/ -maxdepth 1 -type f -name "$want" | grep -q . \
              || { echo "::error::no $want in artifacts/"; fail=1; }
          done

          exit $fail

      # Opens the Intune bundle the way a device would, before anyone can
      # download it. Its payload is encrypted, so no amount of looking at the
      # file tells you the installer is inside: the check above confirms a
      # `.intunewin` is present and plausibly sized, and this one confirms it
      # is not a well-named box of nothing.
      - name: Verify the Intune bundle
        run: python3 tools/verify-intunewin.py artifacts/*.intunewin

      # The release page describes the release it is on, and nothing else.
      #
      # Publishing the whole CHANGELOG meant every download page repeated the
      # notes for every version before it, so the thing a visitor actually came
      # to read - what changed in the version they are about to download - was
      # buried under the history of the ones they already have.
      #
      # Takes the first `## ` section and drops its heading, since the release
      # is already titled with its version.
      # Both the body and its attribution footer come from one script, shared
      # with the workflow that republishes notes for an already-published
      # release. Two copies of this would drift.
      - name: Build the release body
        run: |
          python3 .github/scripts/release-notes.py > RELEASE_NOTES.md
          echo "--- release body ---"
          cat RELEASE_NOTES.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          # On a hand-run the tag does not exist yet; the action creates it at
          # this run's commit.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
