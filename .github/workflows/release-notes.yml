# Republish one release's notes, without rebuilding it.
#
# The release workflow can only write notes for the version it is building, so
# fixing the body of an already-published release had no route at all: re-running
# the build for an old tag would attach the *current* version's installers to it,
# which is worse than the wrong prose.
#
# This exists because a Claude Code session's token is refused outright when it
# tries to create or edit a release ("not permitted for this session type"), so
# the edit has to be made by a workflow using the built-in GITHUB_TOKEN.
#
# Touches the body only. Tag, assets, draft state and release date are untouched.
#
# With `announcement`, it instead publishes a release that is only notes: no
# files, and no label - not "Latest", not "Pre-release". That is for saying what
# changed at a tag that carries nothing to download, where attaching installers
# would be wrong and marking it Latest would push the real release off the top
# of the page.

name: Update release notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish notes for, e.g. 1.0.1 (the matching ## section of CHANGELOG.md).'
        required: true
      tag:
        description: 'Tag to publish at. Defaults to v<version>.'
        required: false
        default: ''
      title:
        description: 'Release title. Defaults to the tag.'
        required: false
        default: ''
      announcement:
        description: 'Create a notes-only release (no files, no Latest label) if the tag has no release yet.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write        # editing a release is a write to repository contents

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags, for the release's commit and the one before

      # Same script the release workflow uses. For a release that is already
      # out, the header and footer it was published with are rebuilt from the
      # release itself - its commit, date, checksum file, build run and
      # Chromium - since the body is replaced whole: given the version alone,
      # fixing a typo stripped the checksums and the build link from the
      # download page.
      - name: Build the release body
        # Through the environment, not pasted into the script: an input
        # holding a quote or $(...) would have run as shell.
        env:
          VERSION: ${{ inputs.version }}
          TAG_INPUT: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-v${VERSION#v}}"
          if gh release view "$TAG" --json tagName > /dev/null 2>&1 && git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            export COMMIT=$(git rev-list -n1 "$TAG")
            export RELEASE_DATE=$(gh release view "$TAG" --json publishedAt -q .publishedAt)
            if gh release download "$TAG" -p SHA256SUMS.txt --clobber 2> /dev/null; then export CHECKSUMS=SHA256SUMS.txt; fi
            export GITHUB_RUN_URL=$(gh release view "$TAG" --json body -q .body | grep -oE "$REPO_URL/actions/runs/[0-9]+" | head -1 || true)
            electron=$(git show "$TAG:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=(JSON.parse(s).devDependencies.electron||'').match(/v(\d+\.\d+\.\d+)/);process.stdout.write(m?m[1]:'')})")
            export CHROMIUM=$(curl -fsSL https://releases.electronjs.org/releases.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).find(x=>x.version==='$electron');process.stdout.write(r?r.chrome:'')})" || true)
            prev=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | awk -v t="$TAG" '$0 == t { print last; exit } { last = $0 }')
            if [ -n "$prev" ]; then export COMPARE_URL="$REPO_URL/compare/$prev...$COMMIT"; fi
          fi
          python3 .github/scripts/release-notes.py "$VERSION" > RELEASE_NOTES.md
          echo "--- release body ---"
          cat RELEASE_NOTES.md

      # An existing release has its body replaced and nothing else touched.
      #
      # A missing one is an error unless `announcement` was asked for, because
      # the default job here is fixing prose on a release that exists - quietly
      # creating an empty release at whatever commit this ran from would be a
      # surprising way to answer a typo in a tag name.
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag is worked out in the script: a version typed as "v1.9.3"
          # made format('v{0}') ask for vv1.9.3, which does not exist - and with
          # announcement set, was created. The notes script strips the "v"
          # too, so the two agree.
          TAG_INPUT: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          ANNOUNCEMENT: ${{ inputs.announcement }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-v${VERSION#v}}"

          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            echo "Updated the notes on \`$TAG\`." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$ANNOUNCEMENT" != "true" ]; then
            echo "::error::no release at $TAG. Pass announcement=true to create a notes-only one."
            exit 1
          fi

          # --latest=false is the whole point: without it GitHub decides, and an
          # announcement carrying no files would take the Latest badge off the
          # release people actually download. No --prerelease either, so the
          # release shows no label at all. No files are passed, so none attach.
          gh release create "$TAG" \
            --title "${TITLE:-$TAG}" \
            --notes-file RELEASE_NOTES.md \
            --latest=false
          echo "Published the notes-only release \`$TAG\`." >> $GITHUB_STEP_SUMMARY

      # Says what the release actually is, rather than trusting that the flags
      # did what they were meant to.
      #
      # `isLatest` is not a --json field on gh release view, so which release
      # holds the Latest badge is asked of the endpoint that decides it. That is
      # the reading worth having: --latest=false is here to stop a notes-only
      # release taking the badge from the one people download, and this is the
      # only way to see whether it did.
      - name: Report what was published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-v${VERSION#v}}"
          gh release view "$TAG" \
            --json tagName,name,isPrerelease,isDraft,assets \
            --template '{{.tagName}} — "{{.name}}"
            prerelease: {{.isPrerelease}}
            draft:      {{.isDraft}}
            assets:     {{len .assets}}
          '
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || echo '(none)')
          echo "  Latest badge is on: $latest"
          {
            echo "Published \`$TAG\` with $(gh release view "$TAG" --json assets --jq '.assets | length') asset(s)."
            echo "The Latest badge is on \`$latest\`."
          } >> $GITHUB_STEP_SUMMARY
