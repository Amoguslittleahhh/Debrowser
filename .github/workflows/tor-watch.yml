# Is the bundled Tor still the newest stable release?
#
# Weekly, and on demand. When it is behind, the run fails and opens an issue -
# once: an issue with the same title that is still open is left alone rather
# than duplicated. See tools/tor-watch.js for what is compared.
name: Tor version watch

on:
  schedule:
    - cron: '17 6 * * 1'        # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare the bundled Tor with the latest stable release
        id: compare
        run: |
          set +e
          node tools/tor-watch.js > watch.txt
          code=$?
          cat watch.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Open an issue if Tor is behind
        if: failure() && steps.compare.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="The bundled Tor is out of date"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$existing" != "0" ]; then echo "already reported"; exit 0; fi
          gh issue create --title "$title" --body "$(cat watch.txt)

          Private windows run this Tor. A stale Tor can carry fixed security bugs, and the Tor network may start refusing it.

          ---
          _Opened by the Tor version watch (.github/workflows/tor-watch.yml)._"
