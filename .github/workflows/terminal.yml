# Debrowser for the terminal (terminal/): unit checks and an end-to-end run in a
# real pseudo-terminal (ConPTY on Windows, through node-pty) - keys, mouse,
# tabs, the address bar, a download, a real site - on Windows, Linux and macOS.
# On Windows and macOS it also runs against the runner's own Edge or Chrome,
# which have no begin-frame control and take the plain screencast path.

name: Terminal browser

on:
  push:
    branches: [claude/headless-debrowser]
    paths: [terminal/**, .github/workflows/terminal.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, browser: chrome-headless-shell }
          - { os: windows-latest, browser: edge }
          - { os: ubuntu-latest, browser: chrome-headless-shell }
          - { os: macos-latest, browser: chrome-headless-shell }
          - { os: macos-latest, browser: chrome }
          # Office and server systems: Windows Server 2022, Ubuntu 22.04 LTS, and RHEL's twin Rocky Linux 9.
          - { os: windows-2022, browser: chrome-headless-shell }
          - { os: ubuntu-22.04, browser: chrome-headless-shell }
          - { os: ubuntu-latest, browser: chrome-headless-shell, container: 'rockylinux/rockylinux:9' }
    name: ${{ matrix.container || matrix.os }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      DEBROWSER_TEST_SITE: https://en.wikipedia.org/wiki/Terminal_emulator | Terminal emulator
      DEBROWSER_TEST_OUT: ${{ github.workspace }}/terminal-output.txt
    steps:
      # A bare server image: what Chromium and the test need (script(1) is in util-linux).
      - name: Install system libraries (Rocky Linux)
        if: matrix.container == 'rockylinux/rockylinux:9'
        shell: sh
        # The image sets no PATH, so once setup-node adds to it the system folders must be named too.
        run: |
          echo /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin >> "$GITHUB_PATH"
          dnf install -y --setopt=install_weak_deps=False util-linux nss atk at-spi2-atk cups-libs libdrm libxkbcommon libXcomposite libXdamage libXrandr libXfixes mesa-libgbm pango cairo alsa-lib libxshmfence unzip

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install chrome-headless-shell
        if: matrix.browser == 'chrome-headless-shell'
        run: npx -y @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/puppeteer"

      # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs, unless allowed.
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux' && !matrix.container
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true # not on 22.04

      - name: Use Microsoft Edge
        if: matrix.browser == 'edge'
        run: echo "DEBROWSER_CHROME=C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" >> "$GITHUB_ENV"

      - name: Use Google Chrome
        if: matrix.browser == 'chrome'
        run: echo "DEBROWSER_CHROME=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"

      - name: Install node-pty (ConPTY on Windows)
        if: runner.os != 'Linux'
        run: |
          npm i --no-save --prefix terminal node-pty@1
          # The macOS prebuild ships its spawn helper without the execute bit.
          chmod +x terminal/node_modules/node-pty/prebuilds/*/spawn-helper 2>/dev/null || true

      - name: Test
        run: node terminal/test.js

      - name: Keep the terminal output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terminal-output-${{ matrix.os }}-${{ matrix.browser }}${{ matrix.container && '-rocky' || '' }}
          path: terminal-output.txt*
          if-no-files-found: ignore
